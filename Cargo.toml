[package]
name = "codanna"
# Fork version: <upstream base>+rcrsr.<private addition counter>
#
#   0.18.0   -- the upstream release this fork is built from. Bump ONLY when
#               rebasing/merging onto a new upstream release. Moving the base
#               does NOT touch the counter.
#   +rcrsr.N -- N counts private additions across the fork's whole life, NOT
#               per base. It is monotonic: it only ever increments, and never
#               resets when the base moves. The fork keeps adding to one body
#               of work, so a counter that went backwards would report that
#               body as having shrunk. Surfaces in `codanna --version` and,
#               via CARGO_PKG_VERSION, in the MCP `initialize` handshake, so a
#               connected client reports exactly which build it is talking to.
#
# `+` is BUILD METADATA, which semver ignores in precedence: every +rcrsr.N
# compares EQUAL to a bare 0.18.0, and +rcrsr.7 does NOT sort above +rcrsr.1.
# That is deliberate -- a `-rcrsr` pre-release would instead sort BELOW 0.18.0,
# making a fork with strictly more code compare as older than the upstream it
# was built from. The counter is informational, not orderable. Do not rely on
# it for version-range gating.
version = "0.18.0+rcrsr.14"
authors = ["Angel Bartolli <bartolli@gmail.com>"]
edition = "2024"
rust-version = "1.95"
description = "Local code intelligence MCP server and CLI for AI coding agents"
documentation = "https://docs.codanna.sh"
repository = "https://github.com/bartolli/codanna"
license = "Apache-2.0"
readme = "README.md"
keywords = ["code-indexing", "code-intelligence", "mcp-server", "semantic-search", "ai-agents"]
categories = ["development-tools", "command-line-utilities", "parsing", "text-processing", "compilers"]
autoexamples = false
exclude = [".github/", "contributing/", "tests/", "docs/", "agents/", ".claude-plugin/", "assets/"]
# This fork is distributed via GitHub Releases + `cargo binstall`, not crates.io.
# The `codanna` crate name is owned by upstream; block accidental `cargo publish`.
publish = false

# `{ version }` in the templates below expands to the RAW Cargo.toml version
# (including the literal '+rcrsr.N'), so it may appear ONLY inside the
# `download/v{ version }/` URL path segment -- that segment is the git tag,
# which keeps the '+'. Release asset filenames and bin-dir are sanitized
# (`+` -> `-`; see .github/workflows/release.yml's `asset_version`) and
# binstall's templating has no transform/filter syntax to derive that from
# `{ version }`, so the sanitized version must be a hardcoded literal here.
# tests/binstall_metadata_tests.rs guards these literals against drift.
[package.metadata.binstall]
pkg-fmt = "txz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "https://github.com/rcrsr/rcrsr-codanna/releases/download/v{ version }/{ name }-0.18.0-rcrsr.14-linux-x64.tar.xz"
bin-dir = "{ name }-0.18.0-rcrsr.14-linux-x64/{ bin }"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "https://github.com/rcrsr/rcrsr-codanna/releases/download/v{ version }/{ name }-0.18.0-rcrsr.14-macos-arm64.tar.xz"
bin-dir = "{ name }-0.18.0-rcrsr.14-macos-arm64/{ bin }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "https://github.com/rcrsr/rcrsr-codanna/releases/download/v{ version }/{ name }-0.18.0-rcrsr.14-windows-x64.zip"
pkg-fmt = "zip"
bin-dir = "{ name }-0.18.0-rcrsr.14-windows-x64/{ bin }{ binary-ext }"

[dependencies]
anyhow = "1.0.104"
bitflags = "2.13.2"
clap = { version = "4.6.9", features = ["derive", "color", "env"] }
crossbeam-channel = "0.5.17"
dashmap = "6.2.1"
dirs = "7.0.0"
figment = { version = "0.10.19", features = ["toml", "env"] }
ignore = "0.4.34"
memmap2 = "0.9.12"
notify = "8.2.2"
num_cpus = "1.17.0"
parking_lot = "0.13.0"
rayon = "1.12.0"
# transport-streamable-http-client-reqwest gives the stdio<->HTTP proxy (src/mcp/proxy.rs) a
# reqwest::Client that implements rmcp's StreamableHttpClient trait, so it can dial the loopback
# backing "codanna serve --http" without a hand-rolled HTTP client (the same reqwest 0.13 crate instance as the `reqwest` dep below).
rmcp = { version = "3.11.0", features = ["server", "client", "transport-io", "transport-child-process", "transport-streamable-http-server", "transport-streamable-http-client", "transport-streamable-http-client-reqwest", "transport-worker"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
hex = "0.4.3"
tantivy = "0.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
toml = { version = "1.2.1", features = ["preserve_order"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tree-sitter = "0.27.2"
tree-sitter-go = "0.25.0"
tree-sitter-gdscript = "6.1.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-kotlin-codanna = "0.3.9"
tree-sitter-php = "0.25.2"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
walkdir = "2.5.0"
# Pinned to the exact version so the ort pin below stays the same crate
# instance. Model files and the ONNX Runtime binaries download over rustls:
# no OpenSSL in the graph. On Linux the prebuilt ONNX Runtime binaries need
# glibc 2.38+ and libstdc++ from GCC 13+.
fastembed = { version = "=7.7.1", default-features = false, features = [
    "hf-hub-rustls-tls",
    "ort-download-binaries-rustls-tls",
] }
# The same crate instance as fastembed's own ort dependency: the two pins move
# together, or the build links two ONNX runtimes. Used to build the
# environment with the capped global thread pool that fastembed's sessions
# run in, and to name the CPU device policy.
ort = { version = "=2.0.0-rc.15", default-features = false }
rand = "0.10.4"
indicatif = "0.18.6"
comfy-table = "8.0.1"
console = "0.16.6"
owo-colors = "4.4.0"
axum = { version = "0.8.9", optional = true }
tower = { version = "0.5.3", optional = true }
serde_urlencoded = "0.7.1"
tokio-util = "0.7.20"
axum-server = { version = "0.9.2", features = ["tls-rustls-no-provider"], optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
rcgen = { version = "0.14.10", optional = true }
is-terminal = "0.4.17"
regex = "1.13.2"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.24.0"
tree-sitter-cpp = "0.23.4"
chrono = "0.4.45"
tempfile = "3.27.0"
serde_json5 = "0.2.1"
tree-sitter-swift = "0.7.4"
tree-sitter-lua = "0.5.0"
tree-sitter-clojure-orchard = "0.2.9"
glob = "0.3.4"
async-trait = "0.1.92"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
webpki-root-certs = "1.0.12"
sysinfo = "0.40.4"
indexmap = { version = "2.14.2", features = ["serde"] }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
testcontainers = "0.28.0"
thread-id = "5.1.0"
# test-util (paused/virtual clock: tokio::time::pause/advance) is only used
# under #[cfg(test)]; kept as a dev-dependency addition rather than enabling
# it on the main `tokio` dependency so it never ships in release builds.
tokio = { version = "1.52.3", features = ["test-util"] }

[features]
default = ["http-server"]
http-server = ["axum", "tower"]
# reqwest's `rustls` feature selects aws-lc-rs as the crypto provider. codanna
# pins `rustls` (above) to `ring` only, and `reqwest` uses `rustls-no-provider`
# (no bundled crypto backend) so `ring` remains the sole provider. Two competing
# providers would make CryptoProvider::get_default_or_install_from_crate_features()
# return None and panic at the first `reqwest::Client` build. Do NOT change
# `rustls-no-provider` to `rustls`.
#
# Because every build now carries reqwest's rustls backend, every
# `reqwest::Client` build -- `serve --https`, the stdio<->HTTP proxy (rmcp's
# streamable-HTTP transport), `serve_tls::pinned_client`, the remote embedder --
# needs a process-default provider. `main.rs` installs `ring` once, before any
# command dispatch, in every feature configuration.
https-server = ["http-server", "axum-server", "rcgen"]
axum = ["dep:axum"]
tower = ["dep:tower"]
axum-server = ["dep:axum-server"]
rcgen = ["dep:rcgen"]

[profile.release]
# opt-level = 3
# lto = true
# codegen-units = 1
# strip = true

[[example]]
name = "simple_progress_demo"
path = "examples/simple_progress_demo.rs"

[[example]]
name = "dump_edges"
path = "examples/dump_edges.rs"

[[example]]
name = "pipeline_metrics_demo"
path = "examples/pipeline_metrics_demo.rs"

[[example]]
name = "parser_census"
path = "examples/parser_census.rs"

[[example]]
name = "resolution_precision"
path = "examples/resolution_precision/main.rs"

[[bench]]
name = "unified_output_bench"
harness = false

[[bench]]
name = "kotlin_parser_bench"
harness = false

[target."cfg(windows)".dependencies]
dunce = "1.0.5"
